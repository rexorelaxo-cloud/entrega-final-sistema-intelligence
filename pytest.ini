[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = .
markers =
    redis: requiere Redis con RediSearch y RedisJSON (TEST_REDIS_URL)
    stack: requiere Redis y un servidor Chroma en ejecución
    openai: requiere OPENAI_API_KEY y acceso a la API de OpenAI
filterwarnings =
    ignore::DeprecationWarning
