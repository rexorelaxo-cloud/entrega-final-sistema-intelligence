[project]
name = "localization-qa-intelligence"
version = "1.0.0"
description = "Sistema multiagente de QA para contenido localizado (FastAPI, LangGraph, RAG, Redis, Phoenix)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117", "E731"]
