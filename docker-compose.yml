# Localization QA Intelligence System - despliegue local
# Uso:  cp .env.example .env  (completar OPENAI_API_KEY)  &&  docker compose up --build
#
# Servicios: redis (checkpointer), chroma (vector store), ingesta (una sola vez), phoenix (trazas) y api.

services:
  redis:
    # Redis 8 incluye RediSearch y RedisJSON, requeridos por langgraph-checkpoint-redis.
    image: redis:8.2.1
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    # Mismo código y versión de chromadb que usa la API (se instala desde requirements.txt).
    build: .
    environment:
      VECTOR_STORE_PATH: /data/chroma
    command: ["sh", "-c", "chroma run --path \"$$VECTOR_STORE_PATH\" --host 0.0.0.0 --port 8001"]
    ports:
      - "8001:8001"
    volumes:
      - chroma_data:/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/api/v2/heartbeat', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingesta:
    # Tarea única: ingiere knowledge/ en Chroma. Se puede repetir con `docker compose run --rm ingesta`.
    build: .
    command: ["python", "-m", "scripts.ingest"]
    env_file: .env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8001"
    depends_on:
      chroma:
        condition: service_healthy
    restart: "no"

  phoenix:
    image: arizephoenix/phoenix:version-21.0.0
    ports:
      - "6006:6006"
    volumes:
      - phoenix_data:/mnt/data
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: "false"

  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      CHROMA_HOST: chroma
      CHROMA_PORT: "8001"
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      ingesta:
        condition: service_completed_successfully
      phoenix:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  redis_data:
  chroma_data:
  phoenix_data:
